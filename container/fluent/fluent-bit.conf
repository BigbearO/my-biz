[SERVICE]
    Flush        1
    Daemon       off
    Log_Level    info
    parsers_file parser.conf

# ═════════════════════════════════════════════
# INPUT 1: Fluentd Forward 协议
# 来源：Go-Kratos（kratos fluent logger）
# ═════════════════════════════════════════════
[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224
    Tag          app.forward

# ═════════════════════════════════════════════
# INPUT 2: TCP 接收 JSON 日志
# 来源：Spring（LogstashTcpSocketAppender）
# ═════════════════════════════════════════════
[INPUT]
    Name         tcp
    Listen       0.0.0.0
    Port         5170
    Tag          app.spring
    Format       json
    Chunk_Size   32
    Buffer_Size  64k

# ═════════════════════════════════════════════
# INPUT 3: TCP 接收 JSON 日志（原 GELF 端口）
# 来源：Quarkus（quarkus-logging-gelf，不改动）
# GELF 本质就是 JSON 行，用 tcp + json 直接接收即可
# ═════════════════════════════════════════════
[INPUT]
    Name         tcp
    Listen       0.0.0.0
    Port         12201
    Tag          app.quarkus
    Format       json
    Chunk_Size   32
    Buffer_Size  64k

# ═════════════════════════════════════════════
# FILTER 1: 统一 Go 端字段命名
# msg → message, module → logger_name
# ═════════════════════════════════════════════
[FILTER]
    Name         modify
    Match        app.forward
    Rename       msg      message
    Rename       module   logger_name

# ═════════════════════════════════════════════
# FILTER 2: 统一 Quarkus GELF 字段
# GELF 自定义字段以 _ 开头，去掉前缀
# short_message → message（GELF 核心字段映射）
# ═════════════════════════════════════════════
[FILTER]
    Name         modify
    Match        app.quarkus
    Rename       short_message message
    Rename       _app          app
    Rename       _env          env
    Rename       _logger_name  logger_name
    Rename       _trace_id     trace_id
    # 移除 GELF 协议元数据字段（减少噪音）
    Remove       version
    Remove       host
    Remove       timestamp
    Remove       level
    Remove       _level
    Remove       _thread_name

# ═════════════════════════════════════════════
# FILTER 3: 统一添加 collector 标签
# ═════════════════════════════════════════════
[FILTER]
    Name         modify
    Match        app.*
    Add          collector fluent-bit

# ═════════════════════════════════════════════
# OUTPUT: OpenObserve（通过 HTTP API）
# ═════════════════════════════════════════════
[OUTPUT]
    Name         http
    Match        app.*
    Host         openobserve
    Port         5080
    URI          /api/default/logs/_json
    Format       json_lines
    Header       Authorization Basic cm9vdEBleGFtcGxlLmNvbTpsazEyMzQ1NkFA
    tls          off
    compress     gzip
