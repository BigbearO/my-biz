syntax = "proto3";
package kratos.api;

option go_package = "demos/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Registry registry = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

message Registry {
  message Nacos {
    message ServerConfig {
      string ip_addr = 1;
      uint64 port = 2;
      string scheme = 3;
      string context_path = 4;
      uint64 grpc_port = 5;
    }
    message ClientConfig {
      string namespace_id = 1;
      uint64 timeout_ms = 2;
      bool not_load_cache_at_start = 3;
      string log_dir = 4;
      string cache_dir = 5;
      string log_level = 6;
      string username = 7;
      string password = 8;
      string endpoint = 9;
      string region_id = 10;
      string access_key = 11;
      string secret_key = 12;
      bool open_kms = 13;
      string rotate_time = 14;
      int32 max_age = 15;
    }
    message ConfigConfig {
      string group = 1;
      repeated string data_id = 2;
      bool enable = 3;
    }
    repeated ServerConfig server = 1;
    ClientConfig client = 2;
    ConfigConfig config = 3;
  }
  Nacos nacos = 1;
}
