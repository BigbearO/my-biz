server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    driver: mysql
    source: root:root@tcp(127.0.0.1:3306)/test?parseTime=True&loc=Local
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s

# Nacos 服务注册发现与配置中心
registry:
  nacos:
    # Nacos 服务器配置 (支持集群配置)
    server:
      - ip_addr: 127.0.0.1      # Nacos 服务器地址
        port: 8848                # HTTP 端口
        scheme: http              # 协议: http 或 https
        context_path: /nacos      # 上下文路径 (可选)
        grpc_port: 9848           # gRPC 端口 (可选，Nacos 2.x)

    # Nacos 客户端配置
    client:
      namespace_id: xhf        # 命名空间 ID (用于环境隔离)
      timeout_ms: 5000            # 请求超时时间(毫秒)
      not_load_cache_at_start: true  # 启动时不加载缓存
      log_dir: ./tmp/nacos/log    # 日志目录
      cache_dir: ./tmp/nacos/cache  # 缓存目录
      log_level: info             # 日志级别: debug/info/warn/error
      rotate_time: 1h             # 日志轮转时间
      max_age: 3                  # 日志最大保留天数
      username: nacos           # 用户名 (开启鉴权时配置)
      password: nacos           # 密码 (开启鉴权时配置)

    # 配置中心 (可选)
    config:
      enable: true               # 是否启用 Nacos 配置中心
      group: DEFAULT_GROUP        # 配置组
      data_id:                    # 配置 DataId 列表
        - system.yaml

