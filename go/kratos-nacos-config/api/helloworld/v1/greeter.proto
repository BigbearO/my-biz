syntax = "proto3";

package helloworld.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "kratosNacosConfig/api/helloworld/v1;v1";
option java_multiple_files = true;
option java_package = "dev.kratos.api.helloworld.v1";
option java_outer_classname = "HelloworldProtoV1";

service Greeter {

  rpc SayHello (HelloRequest) returns (HelloReply) {
    option (google.api.http) = {
      get: "/helloworld/{name}"
    };
  };

  // 精确查找：根据 学校名、班级名获取班级的定额（group固定）
  rpc GetClassQuotaBySchoolNameAndClassName(SchoolAndClassReq) returns(ClassQuotaBase);

  // 修改：根据 学校名、班级名 修改班级定额的配置（group固定）
  // 用 PublishConfig 方法：原来文件不存在的话会新建一个对应dataId的文件（演示一下）
  rpc PublishClassQuotaBySchoolNameAndClassName(PublishReq) returns (google.protobuf.Empty);

  // 模糊查询1：Search方法:（获取某个namespaceId下固定group的所有DataId的数据）获取某个学校 所有班级定额的配置
  rpc SearchAllClassQuotasBySchoolName(SearchAllClassQuotasBySchoolsReq) returns (SearchAllClassQuotasBySchoolsReply);

  // 模糊查询2: Search方法:（获取某个namespaceId下不同group下所有同名的dataId的数据） 某个学校 相同班级的不同配置(class_quota、class_manage)
  rpc SearchClassConfigsBySchoolNameAndClassName(SearchClassConfigsBySchoolNameAndClassNameReq) returns (SearchClassConfigsBySchoolNameAndClassNameReply);

  // 删除配置 DeleteConfig（group固定）
  rpc DeleteClassQuotaBySchoolNameAndClassName(DeleteQuotaReq) returns (google.protobuf.Empty);

  // 根据学校名 修改 school_quota的配置（group固定）
  rpc PublishSchoolQuotaBySchoolName(PublishSchoolQuotaBySchoolNameReq) returns (google.protobuf.Empty);

  // 根据学校名 获取 school_quota的配置（如果QPS太高需要将配置信息加载到本地内存——监听配置变更修改本地内存的数据即可～）
  rpc GetSchoolQuotaBySchoolName(SearchAllClassQuotasBySchoolsReq) returns (SchoolQuotaBase);

}

message PublishSchoolQuotaBySchoolNameReq{
  string schoolName = 1;
  SchoolQuotaBase schoolQuota = 2;
}

message DeleteQuotaReq {
  string schoolName = 1;
  string className = 2;
}

message SearchClassConfigsBySchoolNameAndClassNameReply {
  ClassQuotaBase classQuota = 1;
  ClassManageBase classManage = 2;
}

message SearchClassConfigsBySchoolNameAndClassNameReq {
  string schoolName = 1;
  string className = 2;
}


message SearchAllClassQuotasBySchoolsReply {
  repeated ClassQuotaBase classQuotas = 1;
}


message SearchAllClassQuotasBySchoolsReq {
  string schoolName = 1;
}

message PublishReq {
  SchoolAndClassReq schoolAndClass = 1;
  ClassQuotaBase classQuota = 2;
}

message SchoolAndClassReq {
  string schoolName = 1;
  string className = 2;
}

message ClassQuotaBase {
  string className = 1;
  uint32 students = 2;
  uint32 computer = 3;
  uint32 projector = 4;
  uint32 basketball = 5;
  uint32 football = 6;
}

message SchoolQuotaBase {
  string schoolName = 1;
  uint32 students = 2;
  uint32 teachers = 3;
  uint32 computer = 4;
  uint32 projector = 5;
  uint32 basketball = 6;
  uint32 football = 7;
}

message ClassManageBase {
  string className = 1;
  string reward = 2;
  string activity = 3;
}





message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
