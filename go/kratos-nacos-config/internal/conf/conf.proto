syntax = "proto3";
package kratos.api;

option go_package = "kratosNacosConfig/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  // 这个配置在本地 用于连接nacos
  NacosConfig nacos = 1;
  // 下面的配置都在nacos中
  Server server = 2;
  Data data = 3;
  map<string, string> nacosNamespaceMap = 4;
}

message NacosConfig {
  string addr = 1;
  uint64 port = 2;
  BaseNacos baseYaml = 3;
}

// 定义一个消息类型来表示BaseYaml的配置
message BaseNacos {
  string namespaceId = 3;
  string group = 4;
  string dataId = 5;
}


message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  string id = 3;
  string name = 4;
  string version = 5;
  string environment = 6;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
    int32 min_idle_conns = 3;
    int32 max_open_conns = 4;
    int32 con_max_left_time = 5;
    string databases = 6;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    string password = 3;
    int32 db = 4;
    int32 pool_size = 5;
    int32 min_idle_conns = 6;
    int32 max_retries = 7;
  }
  Database database = 1;
  Redis redis = 2;
}