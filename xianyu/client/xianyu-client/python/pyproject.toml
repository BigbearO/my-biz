[project]
name = "xianyu-client"
version = "0.1.0"
description = "Goodfish local desktop service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "loguru>=0.7.3",
  "pydantic>=2.10.4",
  "cryptography>=44.0.0",
  "aiohttp>=3.11.11"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "httpx>=0.28.1"
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["xianyu_client*", "xianyu*"]

