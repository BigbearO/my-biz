appId: com.goodfish.xianyu
productName: Goodfish

directories:
  output: release

electronDist: node_modules/electron/dist

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
  - "!python/**/*"
  - "!release/**/*"

asar: true
npmRebuild: false

extraResources:
  - from: python/dist/xianyu-client
    to: python
    filter:
      - "**/*"

win:
  signAndEditExecutable: false