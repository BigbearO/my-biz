# Tomcat
server:
  port: 9301

# Spring
spring:
  application:
    # 应用名称（Nacos 注册名；网关路由 lb://goodfish-client-meta-service）
    name: goodfish-client-meta-service
  profiles:
    # 环境配置
    active: @profiles.active@
  # gRPC 服务端（Spring Boot 4.1 官方 spring-grpc；端口由 nacos starter 以 <appName>-grpc 注册到 Nacos）
  grpc:
    server:
      port: 29301
  # 数据源：PostgreSQL 统一库（初级阶段单库 good_fish，各服务表按名前缀隔离）
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://192.168.73.93:5432/good_fish?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&reWriteBatchedInserts=true
          username: root
          password: "123456"
  # Redis：复用 goodfish 栈现有 Redis（与 llm-manage data.yaml 对齐）
  data:
    redis:
      host: 192.168.73.93
      port: 6379
      password: "123456"
      database: 0
      timeout: 10000
      ssl.enabled: false

# MyBatisPlus（与 application-common.yml 同口径）
mybatis-plus:
  enableLogicDelete: true
  mapperPackage: org.dromara.**.mapper
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  typeAliasesPackage: org.dromara.**.domain
  global-config:
    dbConfig:
      idType: ASSIGN_ID

# Sa-Token：与网关共用同一 jwt-secret-key，保证 token 可校验
sa-token:
  token-name: Authorization
  check-same-token: true
  is-concurrent: true
  is-share: false
  jwt-secret-key: abcdefghijklmnopqrstuvwxyz

# gRPC 与 Nacos 的集成（xxs-spring-grpc-nacos）：nacos:// 发现 + gRPC 端口双注册
grpc:
  nacos:
    enabled: true
    server-addr: @nacos.server@
    namespace: @nacos.ns@
    username: @nacos.username@
    password: @nacos.password@
    # 服务端注册 gRPC 端口（HTTP 端口由 spring-cloud nacos discovery 注册，两个服务名）
    server-registration: true

--- # nacos 配置（与 goodfish Python/Go 服务同一 Nacos、同一 namespace，保证跨语言互发现）
spring:
  cloud:
    nacos:
      # nacos 服务地址
      server-addr: @nacos.server@
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        # 注册组
        group: DEFAULT_GROUP
        # 注册命名空间（goodfish 项目统一 namespace）
        namespace: @nacos.ns@
      config:
        # 配置组
        group: DEFAULT_GROUP
        namespace: @nacos.ns@
  config:
    import:
      - optional:nacos:application-common.yml
      - optional:nacos:datasource.yml
      - optional:nacos:${spring.application.name}.yml
