# Tomcat
server:
  port: 9302

# Spring
spring:
  application:
    # 应用名称（Nacos 注册名；网关路由 lb://goodfish-item-service）
    name: goodfish-item-service
  profiles:
    # 环境配置
    active: @profiles.active@
  # gRPC 服务端（Spring Boot 4.1 官方 spring-grpc；端口由 nacos starter 以 <appName>-grpc 注册到 Nacos）
  grpc:
    server:
      port: 29302
    # gRPC 客户端：账号域契约经 nacos:// 发现客户端元数据服务的 gRPC 实例（同步落库解析 account_id 用）
    client:
      channel:
        account:
          target: nacos://goodfish-client-meta-service-grpc


# MyBatisPlus（与 application-common.yml 同口径）
mybatis-plus:
  enableLogicDelete: true
  mapperPackage: org.dromara.**.mapper
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  typeAliasesPackage: org.dromara.**.domain
  global-config:
    dbConfig:
      idType: ASSIGN_ID

# 鉴权：登录态与权限统一由网关校验，服务侧不再配置 Sa-Token（无拦截器、无密钥）

# gRPC 与 Nacos 的集成（xxs-spring-grpc-nacos）：nacos:// 发现 + gRPC 端口双注册
grpc:
  nacos:
    enabled: true
    server-addr: @nacos.server@
    namespace: @nacos.ns@
    username: @nacos.username@
    password: @nacos.password@
    # 服务端注册 gRPC 端口（HTTP 端口由 spring-cloud nacos discovery 注册，两个服务名）
    server-registration: true

--- # nacos 配置（与 goodfish Python/Go 服务同一 Nacos、同一 namespace，保证跨语言互发现）
spring:
  cloud:
    nacos:
      # nacos 服务地址
      server-addr: @nacos.server@
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        # 注册组
        group: DEFAULT_GROUP
        # 注册命名空间（goodfish 项目统一 namespace）
        namespace: @nacos.ns@
      config:
        # 配置组
        group: DEFAULT_GROUP
        namespace: @nacos.ns@
  config:
    import:
      # 提示词模板（系统内置只读，随代码版本发布）
      - optional:classpath:goodfish-prompt-templates.yml
      - optional:nacos:application-common.yml
      - optional:nacos:datasource.yml
      - optional:nacos:${spring.application.name}.yml
