syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// LlmModel 模型服务
service LlmModel {
  // 模型列表（分页）
  rpc List (ListLlmModelRequest) returns (ListLlmModelReply) {
    option (google.api.http) = {
      get: "/llm/model/list"
    };
  }
  // 模型详情
  rpc Get (GetLlmModelRequest) returns (LlmModelInfo) {
    option (google.api.http) = {
      get: "/llm/model/{id}"
    };
  }
  // 新增模型
  rpc Create (CreateLlmModelRequest) returns (LlmModelInfo) {
    option (google.api.http) = {
      post: "/llm/model"
      body: "*"
    };
  }
  // 更新模型
  rpc Update (UpdateLlmModelRequest) returns (LlmModelInfo) {
    option (google.api.http) = {
      put: "/llm/model"
      body: "*"
    };
  }
  // 删除模型
  rpc Delete (DeleteLlmModelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/llm/model/{id}"
    };
  }
  // 启用模型（自动停用其他）
  rpc Enable (EnableLlmModelRequest) returns (LlmModelInfo) {
    option (google.api.http) = {
      put: "/llm/model/enable/{id}"
    };
  }
}

// LlmModelInfo 模型信息
message LlmModelInfo {
  int64 id = 1;
  int64 provider_id = 2;
  string provider_name = 3;  // 关联查询返回
  string display_name = 4;
  string model_name = 5;
  float temperature = 6;
  int32 max_tokens = 7;
  int32 status = 8;
  string created_at = 9;
  string updated_at = 10;
}

// ListLlmModelRequest 列表请求
message ListLlmModelRequest {
  int32 page = 1;
  int32 page_size = 2;
  int64 provider_id = 3;
  string display_name = 4;  // 模糊搜索
  int32 status = 5;
}

// ListLlmModelReply 列表回复
message ListLlmModelReply {
  repeated LlmModelInfo list = 1;
  int64 total = 2;
}

// GetLlmModelRequest 详情请求
message GetLlmModelRequest {
  int64 id = 1;
}

// CreateLlmModelRequest 新增请求
message CreateLlmModelRequest {
  int64 provider_id = 1;
  string display_name = 2;
  string model_name = 3;
  float temperature = 4;
  int32 max_tokens = 5;
  int32 status = 6;
}

// UpdateLlmModelRequest 更新请求
message UpdateLlmModelRequest {
  int64 id = 1;
  int64 provider_id = 2;
  string display_name = 3;
  string model_name = 4;
  float temperature = 5;
  int32 max_tokens = 6;
  int32 status = 7;
}

// DeleteLlmModelRequest 删除请求
message DeleteLlmModelRequest {
  int64 id = 1;
}

// EnableLlmModelRequest 启用请求
message EnableLlmModelRequest {
  int64 id = 1;
}
