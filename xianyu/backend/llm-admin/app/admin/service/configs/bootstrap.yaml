# bootstrap.yaml 本地引导配置(始终本地,不下发):
#   app    应用标识
#   nacos  注册与配置中心连接
#   trace  OTLP(链路 + 日志转发共用端点)
#   log    日志级别
#   env 环境变量(前缀 WIND_)优先级最高,如 WIND_TRACE_ENDPOINT
# 多环境:运行环境由 -e <env>(优先)或 APP_ENV 环境变量指定,二者皆空默认 dev;
#   <base>.<env>.yaml(如 server.dev.yaml / data.test.yaml)为差异覆盖文件,只写差异键,
#   合并优先级:WIND_* 环境变量 > nacos > 覆盖文件 > 基础文件。
#   注意:覆盖文件不要写 nacos: 段——配置中心挂载只认本文件,写了会导致
#   「配置读 A 环境、注册到 B 环境」的分裂;nacos 侧环境隔离请用 namespace/dataId。
app:
  project: ""
  appId: "admin"
  name: "admin-service"
  version: v1.0.0
  env: dev

env:
  host: 10.0.0.5

nacos:
  addr: 10.0.0.5:8848
  namespace: xhf
  group: DEFAULT_GROUP
  dataId: "zero.yaml"   # 远端只放业务配置段(server/data 等)
  timeoutMs: 5000
  username: nacos
  password: nacos

trace:
  endpoint: 10.0.0.5:4317   # OTLP gRPC;留空则不启用链路/日志上报
  sampler: 1.0
  insecure: true

log:
  level: info
