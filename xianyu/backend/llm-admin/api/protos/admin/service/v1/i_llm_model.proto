syntax = "proto3";

package admin.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/api/annotations.proto";
import "pagination/v1/pagination.proto";

import "llm_model/service/v1/llm_model.proto";

// 管理服务
service LlmModelService {
  // 查询列表
  rpc List (pagination.PagingRequest) returns (llm_model.service.v1.ListLlmModelResponse) {
    option (google.api.http) = {
        get: "/admin/v1/llm-models"
    };
  }

  // 查询详情
  rpc Get (llm_model.service.v1.GetLlmModelRequest) returns (llm_model.service.v1.LlmModel) {
    option (google.api.http) = {
        get: "/admin/v1/llm-models/{id}"
    };
  }

  // 创建
  rpc Create (llm_model.service.v1.CreateLlmModelRequest) returns (llm_model.service.v1.LlmModel) {
    option (google.api.http) = {
        post: "/admin/v1/llm-models"
        body: "*"
    };
  }

  // 更新
  rpc Update (llm_model.service.v1.UpdateLlmModelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
        put: "/admin/v1/llm-models/{id}"
        body: "*"
    };
  }

  // 删除
  rpc Delete (llm_model.service.v1.DeleteLlmModelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
        delete: "/admin/v1/llm-models/{id}"
    };
  }

  // 批量创建
  rpc BatchCreate (llm_model.service.v1.BatchCreateLlmModelRequest) returns (llm_model.service.v1.BatchCreateLlmModelResponse) {
    option (google.api.http) = {
        post: "/admin/v1/llm-models/batch"
        body: "*"
    };
  }
}
