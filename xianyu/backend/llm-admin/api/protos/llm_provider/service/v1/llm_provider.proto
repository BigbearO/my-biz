syntax = "proto3";

package llm_provider.service.v1;

import "google/api/annotations.proto";

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 服务
service LlmProviderService {
  // 查询列表
  rpc List (pagination.PagingRequest) returns (ListLlmProviderResponse) {
    option (google.api.http) = {
      get: "/llm/provider/list"
    };
  }

  // 统计数量
  rpc Count (pagination.PagingRequest) returns (CountLlmProviderResponse) {
    option (google.api.http) = {
      get: "/llm/provider/count"
    };
  }

  // 查询详情
  rpc Get (GetLlmProviderRequest) returns (LlmProvider) {
    option (google.api.http) = {
      get: "/llm/provider/{id}"
    };
  }

  // 创建
  rpc Create (CreateLlmProviderRequest) returns (LlmProvider) {
    option (google.api.http) = {
      post: "/llm/provider"
      body: "*"
    };
  }

  // 更新
  rpc Update (UpdateLlmProviderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/llm/provider"
      body: "*"
    };
  }

  // 删除
  rpc Delete (DeleteLlmProviderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/llm/provider/{id}"
    };
  }

  // 批量创建
  rpc BatchCreate (BatchCreateLlmProviderRequest) returns (BatchCreateLlmProviderResponse) {
    option (google.api.http) = {
      post: "/llm/provider/batch"
      body: "*"
    };
  }

  // 测试连接(传 id 用已保存配置;不传 id 用 base_url+api_key)
  rpc TestConnection (TestConnectionRequest) returns (TestConnectionReply) {
    option (google.api.http) = {
      post: "/llm/provider/test"
      body: "*"
    };
  }
}

// 
message LlmProvider {
  optional int64 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: ""}
  ]; // 

  optional string name = 2 [
    json_name = "name",
    (gnostic.openapi.v3.property) = {description: ""}
  ]; // 

  optional string base_url = 3 [
    json_name = "baseUrl",
    (gnostic.openapi.v3.property) = {description: ""}
  ]; // 

  optional string api_key = 4 [
    json_name = "apiKey",
    (gnostic.openapi.v3.property) = {description: ""}
  ]; // 

  optional int32 status = 5 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {description: ""}
  ]; // 

  optional google.protobuf.Timestamp created_at = 6 [
    json_name = "createdAt",
    (gnostic.openapi.v3.property) = {description: ""}
  ]; // 

  optional google.protobuf.Timestamp updated_at = 7 [
    json_name = "updatedAt",
    (gnostic.openapi.v3.property) = {description: ""}
  ]; // 

}

message ListLlmProviderResponse {
  repeated LlmProvider items = 1;
  uint64 total = 2;
}

message GetLlmProviderRequest {
  oneof query_by {
    int64 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

message CreateLlmProviderRequest {
  LlmProvider data = 1;
}

message UpdateLlmProviderRequest {
  int64 id = 1;

  LlmProvider data = 2;

  google.protobuf.FieldMask update_mask = 100 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,realname,username"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 101 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
}

message DeleteLlmProviderRequest {
  oneof delete_by {
    int64 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

message BatchCreateLlmProviderRequest {
  repeated LlmProvider data = 1;
}
message BatchCreateLlmProviderResponse {
  repeated LlmProvider data = 1;
}

message CountLlmProviderResponse {
  uint64 count = 1;
}

// TestConnectionRequest 测试连接请求
message TestConnectionRequest {
  // 传 id 则用已保存的配置
  int64 id = 1 [
    json_name = "id"
  ];
  // 不传 id 则用传入的配置
  string base_url = 2 [
    json_name = "baseUrl"
  ];
  string api_key = 3 [
    json_name = "apiKey"
  ];
}

// TestConnectionReply 测试连接结果
message TestConnectionReply {
  bool success = 1 [
    json_name = "success"
  ];
  string message = 2 [
    json_name = "message"
  ];
  // 延迟(毫秒)
  int64 latency_ms = 3 [
    json_name = "latencyMs"
  ];
}
