syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.bigbear.upms";
option java_outer_classname = "UserGrpcProto";

package upms;

service UserGrpc {
    rpc getUserInfo (UserInfoReq) returns (UserInfo) {}
}

message UserInfoReq {
    int64  userId = 1;
}

message UserInfo {
    string userName =1 ;
}
