# 应用名称
spring.application.name=xianyu-auto-agent

# 服务器配置
server.port=8080

# 数据库配置
spring.datasource.url=jdbc:postgresql://localhost:5432/xianyu_auto_agent
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.xianyu.autoagent.domain.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=AUTO

# WebSocket配置
spring.websocket.path=/ws

# 日志配置
logging.level.root=INFO
logging.level.com.xianyu.autoagent=DEBUG

# 代理配置
xianyu.heartbeat.interval=15
xianyu.heartbeat.timeout=5
xianyu.token.refresh.interval=3600
xianyu.token.retry.interval=300
xianyu.manual.mode.timeout=3600
xianyu.message.expire.time=300000
xianyu.toggle.keywords=。

# AI模型配置
ai.model.base-url=${MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
ai.model.api-key=${API_KEY}