# 服务器配置
server.port=8080

# 数据库配置
spring.datasource.url=jdbc:postgresql://localhost:5432/xianyu_agent
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MyBatis-Plus配置
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=AUTO

# 日志配置
logging.level.root=INFO
logging.level.com.xianyu.agent=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# WebSocket配置
spring.websocket.server.allowed-origins=*

# 心跳配置
xianyu.heartbeat.interval=15000
xianyu.heartbeat.timeout=5000

# Token刷新配置
xianyu.token.refresh.interval=3600000
xianyu.token.retry.interval=300000

# 人工接管配置
xianyu.manual.mode.timeout=3600000
xianyu.manual.mode.toggle-keywords=。

# 消息过期时间
xianyu.message.expire.time=300000

# LLM配置
xianyu.llm.api-key=${API_KEY:your-api-key}
xianyu.llm.base-url=${MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
xianyu.llm.model-name=${MODEL_NAME:qwen-max}

# 提示词路径
xianyu.prompts.path=prompts