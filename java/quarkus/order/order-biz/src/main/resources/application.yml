greeting:
  message: "hello"


quarkus:
  http:
    port: 8802
    cors:
      enabled: true
      origins: '*'
      #      headers: accept, authorization, content-type, x-requested-with
      methods: GET, OPTIONS, POST, DELETE, PUT, PATCH
  grpc:
    server:
      use-separate-server: false  # 提供两种grpc,false Use the Vert.x based server,否则就是netty
    clients:
      userGrpc:
        use-quarkus-grpc-client: true # 'Use client using the Vert.x based transport'
        host: pig-job
        port: 8899
        load-balancing-policy: round_robin
