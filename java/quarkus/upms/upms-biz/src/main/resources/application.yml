greeting:
  message: "hello"

quarkus:
  application:
    name: userGrpc
  http:
    port: 8899
    cors:
      enabled: true
      origins: '*'
#      headers: accept, authorization, content-type, x-requested-with
      methods: GET, OPTIONS, POST, DELETE, PUT, PATCH
  grpc:
    server:
      use-separate-server: false  # 提供两种grpc,false Use the Vert.x based server,否则就是netty
    clients:
      hello:
        use-quarkus-grpc-client: true # 'Use client using the Vert.x based transport'
  stork:
    order:
      service-registrar:
        type: consul
      service-discovery:
        type: consul
    consul-config:
      enabled: false
      properties-value-keys: config/${quarkus.application.name}
      agent:
        host-port: ${consul.host}:${consul.port:8500}


consul:
  host: 192.168.50.250
  port: 8500

