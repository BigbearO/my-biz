server:
  port: 8001

spring:
  application:
    name: @artifactId@
  cloud:
    nacos:
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: ${NACOS_HOST:192.168.50.250}:${NACOS_PORT:8848}
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
  config:
    import:
      - nacos:application.yml
      - nacos:${spring.application.name}.yml
  datasource:  # 示例数据源配置，注意修改也可配置至 nacos
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://192.168.50.250:3305/bigbear-biz?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Asia/Shanghai


rocketmq:
  name-server: 192.168.50.77:9876
  producer:
    group: auto-games
    send-message-timeout: 3000
    # 消息最大长度，默认1024 * 1024 * 4(默认4M)
    max-message-size: 40960
    # 发送消息失败重试次数，默认2
    retryTimesWhenSendFailed: 2
    # 异步消息重试此处，默认2
    retryTimesWhenSendAsyncFailed: 2
    # 压缩消息阈值，默认4k(1024 * 4)
    compressMessageBodyThreshold: 4096
    # 是否在内部发送失败时重试另一个broker，默认false
    retryNextServer: false

  consumer:
    group: auto-games
    pull-batch-size: 5


#  rocketmq.producer.retry-times-when-send-failed=3
#  rocketmq.producer.retry-times-when-send-async-failed=2

