server:
  port: 8088

spring:
  application:
    name: greeter
  grpc:
    # gRPC 服务端：监听 9099（由 nacos starter 以 greeter-grpc 注册到 Nacos）
    server:
      port: 9099
      reflection:
        enabled: false
    # gRPC 客户端：greeter 通道通过 nacos 发现 greeter-grpc 服务
    client:
      channel:
        greeter:
          target: nacos://greeter-grpc
        # user 通道通过 nacos 发现 bear-admin（Go 提供方）gRPC 实例
        user:
#          todo 这里改一下
          target: nacos://bear-ai.grpc
  # 将 HTTP(8088) 以 greeter 注册到 Nacos（与 gRPC 端口分属两个服务名）
  cloud:
    nacos:
      server-addr: 192.168.50.45:8848
      username: nacos
      password: nacos
      discovery:
        group: DEFAULT_GROUP
        server-addr: 192.168.50.45:8848
        namespace: xhf

  # 动态多数据源（方案 B）：seata: true 使每个物理数据源被 Seata XA 代理包裹
  datasource:
    dynamic:
      primary: seata_java
      strict: false
      seata: true
      seata-mode: XA
      datasource:
        seata_java:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://192.168.50.45:5432/seata_java
          username: root
          password: "123456"

grpc:
  nacos:
    enabled: true
    server-addr: 192.168.50.45:8848
    namespace: xhf
    server-registration: true
    username: nacos
    password: nacos
    group: DEFAULT_GROUP

# Seata 客户端（全局事务发起方）配置
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: greeter-group
  # 关闭 Seata 自动代理，由 dynamic-datasource 接管数据源代理，避免双重代理
  enable-auto-data-source-proxy: false
  data-source-proxy-mode: XA
  config:
    type: file
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 192.168.50.45:8848
      group: DEFAULT_GROUP
      namespace: xhf
      username: nacos
      password: nacos
  service:
    vgroup-mapping:
      greeter-group: default
