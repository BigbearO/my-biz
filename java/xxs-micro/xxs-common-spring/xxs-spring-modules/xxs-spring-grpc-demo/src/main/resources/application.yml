server:
  port: 8088

spring:
  application:
    name: greeter
  grpc:
    # gRPC 服务端：监听 9090（由 nacos starter 以 greeter-grpc 注册到 Nacos）
    server:
      port: 9099
      reflection:
        enabled: false
    # gRPC 客户端：greeter 通道通过 nacos 发现 greeter-grpc 服务
    client:
      channel:
        greeter:
          target: nacos://greeter-grpc
        # user 通道通过 nacos 发现 bear-admin（Go 提供方）gRPC 实例
        user:
#          todo 这里改一下
          target: nacos://bear-ai.grpc
  # 将 HTTP(8080) 以 greeter 注册到 Nacos（与 gRPC 端口分属两个服务名）
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        group: DEFAULT_GROUP
        server-addr: 127.0.0.1:8848
        namespace: xhf

grpc:
  nacos:
    enabled: true
    server-addr: 127.0.0.1:8848
    namespace: xhf
    server-registration: true
    username: nacos
    password: nacos
    group: DEFAULT_GROUP
