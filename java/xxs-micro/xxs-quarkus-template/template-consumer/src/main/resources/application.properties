# ============================================================
# \u5E94\u7528\u57FA\u7840\u914D\u7F6E
# ============================================================
quarkus.application.name=template-consumer
quarkus.http.port=8086
# consumer \u4EC5\u4F5C\u4E3A gRPC \u5BA2\u6237\u7AEF\uFF0C\u4E0D\u542F\u52A8 gRPC \u670D\u52A1\u7AEF
quarkus.grpc.server.enabled=false

# ============================================================
# \u5B98\u65B9\u914D\u7F6E\u4E2D\u5FC3\uFF08quarkus-config-nacos\uFF0CHTTP \u76F4\u8FDE Nacos\uFF09
# ============================================================
quarkus.config.source.nacos.server-addr=127.0.0.1:8848
quarkus.config.source.nacos.namespace=xhf
quarkus.config.source.nacos.data-id=test.properties
quarkus.config.source.nacos.username=nacos
quarkus.config.source.nacos.password=nacos
quarkus.config.source.nacos.group=DEFAULT_GROUP

# ============================================================
# gRPC \u5BA2\u6237\u7AEF\uFF1A\u7ECF Stork \u8D70 Nacos \u53D1\u73B0 + round_robin \u8D1F\u8F7D\u5747\u8861
# host=stork://<\u670D\u52A1\u540D> \u6307\u5411 provider \u6CE8\u518C\u7684 template-provider-grpc
# ============================================================
quarkus.grpc.clients.greeter.name-resolver=stork
quarkus.grpc.clients.greeter.host=template-provider-grpc

# \u53D1\u73B0\u4FA7\u8FDE\u63A5\u4FE1\u606F\u9ED8\u8BA4\u590D\u7528 quarkus.config.source.nacos.*
quarkus.stork.template-provider-grpc.service-discovery.type=nacos
# Stork \u8D1F\u8F7D\u5747\u8861\u7B56\u7565
quarkus.stork.template-provider-grpc.load-balancer.type=round-robin

# ============================================================
# consumer \u81EA\u8EAB\u6CE8\u518C\uFF08HTTP\uFF09\uFF1A\u4F9B\u5176\u4ED6\u670D\u52A1\u53D1\u73B0\u672C consumer
# ============================================================
quarkus.stork.template-consumer.service-registrar.type=nacos
quarkus.stork.template-consumer.service-registrar.parameters.host=${app.host:127.0.0.1}
quarkus.stork.template-consumer.service-registrar.parameters.port=${quarkus.http.port}

quarkus.otel.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=false
quarkus.otel.exporter.otlp.endpoint=http://192.168.50.45:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.resource.attributes=deployment.environment=dev
 # ============================================================
# \u63A7\u5236\u53F0\u4FDD\u7559\u4EBA\u7C7B\u53EF\u8BFB\u683C\u5F0F\uFF08\u5F00\u53D1\u8C03\u8BD5\u7528\uFF09
# ============================================================
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
