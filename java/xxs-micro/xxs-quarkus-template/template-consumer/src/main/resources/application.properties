# ============================================================
# 应用基础配置
# ============================================================
quarkus.application.name=template-consumer
quarkus.http.port=8081
# consumer 仅作为 gRPC 客户端，不启动 gRPC 服务端
quarkus.grpc.server.enabled=false

# ============================================================
# 官方配置中心（quarkus-config-nacos，HTTP 直连 Nacos）
# ============================================================
quarkus.config.source.nacos.server-addr=127.0.0.1:8848
quarkus.config.source.nacos.namespace=public
quarkus.config.source.nacos.data-id=${quarkus.application.name}.properties
quarkus.config.source.nacos.group=DEFAULT_GROUP
quarkus.config.source.nacos.devservices.enabled=false

# ============================================================
# gRPC 客户端：经 Stork 走 Nacos 发现 + round_robin 负载均衡
# host=stork://<服务名> 指向 provider 注册的 template-provider-grpc
# ============================================================
quarkus.grpc.clients.greeter.host=stork://template-provider-grpc
quarkus.grpc.clients.greeter.load-balancing-policy=round_robin

# 发现侧连接信息默认复用 quarkus.config.source.nacos.*
quarkus.stork.template-provider-grpc.service-discovery.type=nacos
# Stork 负载均衡策略
quarkus.stork.template-provider-grpc.load-balancer.type=round_robin

# ============================================================
# consumer 自身注册（HTTP）：供其他服务发现本 consumer
# ============================================================
quarkus.stork.template-consumer.service-registrar.type=nacos
quarkus.stork.template-consumer.service-registrar.parameters.host=${app.host:localhost}
quarkus.stork.template-consumer.service-registrar.parameters.port=${quarkus.http.port}
