# ============================================================
# \u5E94\u7528\u57FA\u7840\u914D\u7F6E
# ============================================================
quarkus.application.name=template-provider
quarkus.http.port=8080
# gRPC \u670D\u52A1\u7AEF\u7AEF\u53E3\uFF08\u540C\u65F6\u4F5C\u4E3A template-provider-grpc \u7684\u6CE8\u518C\u7AEF\u53E3\uFF09
quarkus.grpc.server.port=9090

# ============================================================
# \u5B98\u65B9\u914D\u7F6E\u4E2D\u5FC3\uFF08quarkus-config-nacos\uFF0CHTTP \u76F4\u8FDE Nacos\uFF09
# \u6BCF\u670D\u52A1\u4E00\u4E2A data-id\uFF0C\u547D\u540D\u4E3A ${quarkus.application.name}.properties
# ============================================================
quarkus.config.source.nacos.server-addr=127.0.0.1:8848
quarkus.config.source.nacos.namespace=xhf
quarkus.config.source.nacos.data-id=test.properties
quarkus.config.source.nacos.group=DEFAULT_GROUP
quarkus.config.source.nacos.username=nacos
quarkus.config.source.nacos.password=nacos
# \u4E0D\u4F7F\u7528\u6269\u5C55\u81EA\u5E26\u7684 devservices\uFF0C\u7EDF\u4E00\u7531 docker-compose \u542F\u52A8 Nacos
quarkus.config.source.nacos.devservices.enabled=false

# ============================================================
# \u53CC\u6CE8\u518C\uFF1AHTTP \u670D\u52A1\uFF08template-provider\uFF09
# Quarkus \u542F\u52A8\u65F6\u8BFB\u53D6 parameters.host/port \u5B8C\u6210\u6CE8\u518C
# ============================================================
quarkus.stork.template-provider.service-registrar.type=nacos
quarkus.stork.template-provider.service-registrar.parameters.host=${app.host:localhost}
quarkus.stork.template-provider.service-registrar.parameters.port=${quarkus.http.port}

# ============================================================
# \u53CC\u6CE8\u518C\uFF1AgRPC \u670D\u52A1\uFF08template-provider-grpc\uFF09
# \u670D\u52A1\u540D\u4EE5 -grpc \u7ED3\u5C3E\uFF0CNacos \u9002\u914D\u5668\u636E\u6B64\u5199\u5165 protocol=grpc \u5143\u6570\u636E
# ============================================================
quarkus.stork.template-provider-grpc.service-registrar.type=nacos
quarkus.stork.template-provider-grpc.service-registrar.parameters.host=${app.host:localhost}
quarkus.stork.template-provider-grpc.service-registrar.parameters.port=${quarkus.grpc.server.port}
