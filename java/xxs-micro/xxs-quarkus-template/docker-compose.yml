version: "3.8"

services:
  # Nacos 注册中心 + 配置中心（standalone 单机模式）
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: nacos-standalone
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 服务提供者：HTTP(8080) + gRPC(9090)，双注册到 Nacos
  template-provider:
    build: ./template-provider
    container_name: template-provider
    environment:
      # 容器内以服务名作为注册 host，使同网络 consumer 可解析
      - APP_HOST=template-provider
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      nacos:
        condition: service_healthy

  # 服务消费者：REST(8081)，gRPC 客户端经 Nacos 发现 provider-grpc
  template-consumer:
    build: ./template-consumer
    container_name: template-consumer
    environment:
      - APP_HOST=template-consumer
    ports:
      - "8081:8081"
    depends_on:
      nacos:
        condition: service_healthy
      template-provider:
        condition: service_started
