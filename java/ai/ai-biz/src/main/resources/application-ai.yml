spring:
  datasource:
    dynamic:
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driver-class-name: org.postgresql.Driver
          url: ${datasource.system-master.url}
          username: ${datasource.system-master.username}
          password: ${datasource.system-master.password}
  ai:
    mcp:
      client:
        stdio:
          servers-configuration: classpath:/mcp2.json
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8080
#        streamable-http:
#          connections:
#            s1:
#              url: http://localhost:8080

    chat:
      client:
        enabled: false # 禁用 ChatClient.Builder 自动配置,方便手动创建多个 ChatClient 实例。
      memory:
        max-messages: 10        # 滑动窗口大小（保留最新 N 条消息）
        redis-ttl-days: 7       # Redis Key 过期时间（天）
        key-prefix: "chat:memory:"  # Redis Key 前缀
