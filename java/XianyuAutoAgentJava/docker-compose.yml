version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: xianyu-postgres
    environment:
      POSTGRES_DB: xianyu_auto_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xianyu_auto_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xianyu-auto-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/xianyu_auto_agent
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL_URL=${LLM_MODEL_URL}
      - XIANYU_COOKIE=${XIAYU_COOKIE}
      - XIANYU_WEBSOCKET_URL=${XIAYU_WEBSOCKET_URL}
    ports:
      - "8080:8080"
    restart: always

volumes:
  postgres_data:
    driver: local
